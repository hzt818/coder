[package]
name = "coder"
version = "0.1.0"
edition = "2021"
description = "🦀 AI-powered development tool - integrating features from Claude Code and OpenCode"
authors = ["Coder Team"]

[lib]
name = "coder"
path = "src/lib.rs"

[[bin]]
name = "coder"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "sync", "process", "io-util", "signal", "net", "fs", "time"] }
async-trait = "0.1"

# TUI
ratatui = "0.29"
crossterm = "0.28"
syntect = "5.2"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# AI Provider / HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Git (feature-gated)
gix = { version = "0.66", optional = true }

# Docker (feature-gated)
bollard = { version = "0.17", optional = true }

# Database
libsql = { version = "0.6", optional = true }
rusqlite = { version = "0.29", features = ["bundled"], optional = true }

# OAuth
open = { version = "5", optional = true }

# Audio (feature-gated)
cpal = { version = "0.15", optional = true }
hound = { version = "3.5", optional = true }

# Computer use (feature-gated)
enigo = { version = "0.2", optional = true }
screenshots = { version = "0.3", optional = true }
image = { version = "0.25", optional = true }

# Web / API server (feature-gated)
axum = { version = "0.7", features = ["ws"], optional = true }
tokio-stream = { version = "0.1", optional = true }

# SDK exports
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

# Tool utilities
glob = "0.3"

# Async helpers
futures = "0.3"

# Security / Encryption (feature-gated)
aes-gcm = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
zeroize = { version = "1", features = ["zeroize_derive"], optional = true }
argon2 = { version = "0.5", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
regex = { version = "1", optional = true }

# Errors / Validation
url = "2"

[dev-dependencies]
tempfile = "3"
futures = "0.3"
httpmock = "0.6"

[features]
default = ["ai-openai", "ai-anthropic", "ai-opencode"]
ai-openai = []
ai-anthropic = []
ai-google = []
ai-opencode = ["oauth"]
tools-git = ["dep:gix"]
tools-docker = ["dep:bollard"]
tools-db = []
tools-oauth = []
team = []
skill = []
subagent = []
memory = []
storage = ["dep:rusqlite", "dep:libsql"]
server = ["dep:axum", "dep:tokio-stream"]
mcp = []
lsp = []
sync = []
voice = ["dep:cpal", "dep:hound"]
oauth = ["dep:open", "dep:axum"]
analytics = []
permission = []
security = ["dep:aes-gcm", "dep:rand", "dep:zeroize", "dep:argon2", "dep:sha2", "dep:base64", "dep:regex"]
computer = ["dep:enigo", "dep:screenshots", "dep:image"]
worktree = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
