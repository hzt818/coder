[package]
name = "coder-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
coder-core = { path = "../coder-core" }
coder-ai = { path = "../coder-ai" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
env_logger = "0.10"
# parse simple config files
toml = "0.7"

[dev-dependencies]
# used by tests for temporary files
tempfile = "3.6"
