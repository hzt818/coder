[package]
name = "coder-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
# tokio used for async tests
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }

[features]
ai-openai = []
ai-anthropic = []
ai-opencode = []
